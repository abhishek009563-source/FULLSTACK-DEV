<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetix Task Board - Premium Kanban Dashboard</title>
  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Decorative background elements -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="material-symbols-outlined logo-icon">grid_view</span>
        <h1>Aesthetix <span>Task Board</span></h1>
      </div>
      <div class="header-actions">
        <button id="btn-new-task" class="btn btn-primary">
          <span class="material-symbols-outlined">add</span>
          New Task
        </button>
      </div>
    </header>

    <!-- Stats Dashboard Section -->
    <section class="dashboard-stats">
      <div class="stat-card">
        <div class="stat-icon-wrapper todo-icon">
          <span class="material-symbols-outlined">playlist_add</span>
        </div>
        <div class="stat-info">
          <h3 id="stat-total">0</h3>
          <p>Total Tasks</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper progress-icon">
          <span class="material-symbols-outlined">cached</span>
        </div>
        <div class="stat-info">
          <h3 id="stat-progress">0</h3>
          <p>In Progress</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper done-icon">
          <span class="material-symbols-outlined">task_alt</span>
        </div>
        <div class="stat-info">
          <h3 id="stat-completion">0%</h3>
          <p>Completion Rate</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper urgent-icon">
          <span class="material-symbols-outlined">error_outline</span>
        </div>
        <div class="stat-info">
          <h3 id="stat-high-priority">0</h3>
          <p>High Priority</p>
        </div>
      </div>
    </section>

    <!-- Filters Section -->
    <section class="filters-bar">
      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="filter-search" placeholder="Search tasks by title...">
      </div>
      <div class="filter-dropdowns">
        <div class="select-wrapper">
          <span class="material-symbols-outlined select-icon">label</span>
          <select id="filter-category">
            <option value="all">All Categories</option>
            <!-- Dynamically populated categories -->
          </select>
        </div>
        <div class="select-wrapper">
          <span class="material-symbols-outlined select-icon">priority_high</span>
          <select id="filter-priority">
            <option value="all">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <button id="btn-reset-filters" class="btn btn-secondary btn-icon-only" title="Reset Filters">
          <span class="material-symbols-outlined">filter_alt_off</span>
        </button>
      </div>
    </section>

    <!-- Kanban Board Grid -->
    <main class="kanban-board">
      
      <!-- To Do Column -->
      <div class="kanban-column" id="col-todo" data-status="todo">
        <div class="column-header">
          <div class="column-title">
            <span class="col-dot dot-todo"></span>
            <h2>To Do</h2>
            <span class="task-count" id="count-todo">0</span>
          </div>
        </div>
        <div class="task-list" id="list-todo">
          <!-- Tasks dynamically rendered here -->
        </div>
      </div>

      <!-- In Progress Column -->
      <div class="kanban-column" id="col-inprogress" data-status="inprogress">
        <div class="column-header">
          <div class="column-title">
            <span class="col-dot dot-inprogress"></span>
            <h2>In Progress</h2>
            <span class="task-count" id="count-inprogress">0</span>
          </div>
        </div>
        <div class="task-list" id="list-inprogress">
          <!-- Tasks dynamically rendered here -->
        </div>
      </div>

      <!-- Done Column -->
      <div class="kanban-column" id="col-done" data-status="done">
        <div class="column-header">
          <div class="column-title">
            <span class="col-dot dot-done"></span>
            <h2>Done</h2>
            <span class="task-count" id="count-done">0</span>
          </div>
        </div>
        <div class="task-list" id="list-done">
          <!-- Tasks dynamically rendered here -->
        </div>
      </div>

    </main>
  </div>

  <!-- Modal for Creating/Editing Task -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Create New Task</h2>
        <button class="btn-close" id="btn-close-modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id">
        
        <div class="form-group">
          <label for="task-title-input">Task Title *</label>
          <input type="text" id="task-title-input" placeholder="What needs to be done?" required>
        </div>

        <div class="form-group">
          <label for="task-desc-input">Description</label>
          <textarea id="task-desc-input" rows="3" placeholder="Add some details about this task..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-category-input">Category</label>
            <input type="text" id="task-category-input" placeholder="e.g. Work, Design, Personal" list="categories-list">
            <datalist id="categories-list">
              <option value="Work">
              <option value="Design">
              <option value="Development">
              <option value="Personal">
            </datalist>
          </div>

          <div class="form-group">
            <label for="task-priority-input">Priority</label>
            <select id="task-priority-input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-due-input">Due Date</label>
            <input type="date" id="task-due-input">
          </div>

          <div class="form-group">
            <label for="task-status-input">Status</label>
            <select id="task-status-input">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-delete-task" class="btn btn-danger hidden">
            <span class="material-symbols-outlined">delete</span>
            Delete Task
          </button>
          <div class="right-buttons">
            <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="btn-save-task" class="btn btn-primary">Save Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Client Script -->
  <script src="app.js"></script>
</body>
</html>
